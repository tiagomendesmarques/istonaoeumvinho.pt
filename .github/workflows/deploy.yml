name: Deploy para Google Cloud Run

# Cada push para o main publica o site no Cloud Run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # necessário para autenticar na Google Cloud sem chaves (Workload Identity Federation)

concurrency:
  group: deploy-producao
  cancel-in-progress: false

env:
  # --- Google Cloud ---
  PROJECT_ID: istonaoeumvinho
  REGION: europe-west1
  SERVICE: istonaoeumvinho
  REPOSITORY: istonaoeumvinho
  WIF_PROVIDER: projects/831923914703/locations/global/workloadIdentityPools/github/providers/github
  DEPLOY_SA: github-deploy@istonaoeumvinho.iam.gserviceaccount.com
  RUNTIME_SA: istonaoeumvinho-run@istonaoeumvinho.iam.gserviceaccount.com

  # --- Email (a password está no Secret Manager: segredo "smtp-password") ---
  SMTP_HOST: smtp-pt.securemail.pro
  SMTP_PORT: "465"
  SMTP_ENCRYPTION: ssl
  SMTP_USER: geral@istonaoeumvinho.pt
  MAIL_TO: geral@istonaoeumvinho.pt
  PRECO: "99"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar na Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build e push da imagem
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/site:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --build-arg VERSION="${GITHUB_SHA::8}" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy no Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --service-account=${{ env.RUNTIME_SA }}
            --memory=256Mi
            --cpu=1
            --min-instances=0
            --max-instances=4
          env_vars: |
            SMTP_HOST=${{ env.SMTP_HOST }}
            SMTP_PORT=${{ env.SMTP_PORT }}
            SMTP_ENCRYPTION=${{ env.SMTP_ENCRYPTION }}
            SMTP_USER=${{ env.SMTP_USER }}
            MAIL_TO=${{ env.MAIL_TO }}
            PRECO=${{ env.PRECO }}
          secrets: |
            SMTP_PASSWORD=smtp-password:latest

      - name: Verificar se o site responde
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Site publicado em: $URL"
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" "$URL/"
